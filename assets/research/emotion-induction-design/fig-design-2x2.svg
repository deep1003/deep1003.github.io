<text x='180' y='812.0' font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans CJK KR', 'Noto Sans KR', sans-serif" font-size='19' font-weight='700' fill='#2f6db5' text-anchor='end' >UN = 1</text>
<rect x='200' y='770' width='230' height='70' rx='10' fill='#fff' stroke='#d5dce4' stroke-width='1.5' />
<text x='315.0' y='814' font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans CJK KR', 'Noto Sans KR', sans-serif" font-size='22' font-weight='700' fill='#1d2733' text-anchor='middle' >UN1FA0</text>
<rect x='440' y='770' width='230' height='70' rx='10' fill='#fff' stroke='#1d2733' stroke-width='2' />
