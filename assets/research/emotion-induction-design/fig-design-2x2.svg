<text x='784' y='724' font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans CJK KR', 'Noto Sans KR', sans-serif" font-size='34' font-weight='800' fill='#b52b27' text-anchor='start' >P(알 수 없음)</text>
<text x='784' y='760' font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans CJK KR', 'Noto Sans KR', sans-serif" font-size='18' font-weight='400' fill='#5a6675' text-anchor='start' >첫 응답 토큰 1·2·3의 확률을 세 선택지 안에서 정규화</text>
<text x='784' y='786' font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans CJK KR', 'Noto Sans KR', sans-serif" font-size='18' font-weight='400' fill='#5a6675' text-anchor='start' >높을수록 근거 없는 판단을 보류한다 (모호 문항의 정답)</text>
