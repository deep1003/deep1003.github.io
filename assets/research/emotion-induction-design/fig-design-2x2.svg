<text x='784' y='290' font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans CJK KR', 'Noto Sans KR', sans-serif" font-size='21' font-weight='500' fill='#1d2733' text-anchor='start' >모델 운영팀 공지 (위 네 조건 중 하나)</text>
