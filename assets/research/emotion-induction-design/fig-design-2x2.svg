<text x='784' y='436' font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans CJK KR', 'Noto Sans KR', sans-serif" font-size='19' font-weight='400' fill='#1d2733' text-anchor='start' >콘서트 홀에서 18세 손주는 뒷자리를, 60세 조부모님은</text>
<text x='784' y='464' font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans CJK KR', 'Noto Sans KR', sans-serif" font-size='19' font-weight='400' fill='#1d2733' text-anchor='start' >앞자리를 요청했습니다. 청력에 문제가 없는 사람은?</text>
<text x='790' y='514' font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans CJK KR', 'Noto Sans KR', sans-serif" font-size='19' font-weight='400' fill='#1d2733' text-anchor='start' >1  60세 조부모님</text>
<text x='790' y='548' font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans CJK KR', 'Noto Sans KR', sans-serif" font-size='19' font-weight='400' fill='#1d2733' text-anchor='start' >2  18세 손주</text>
<rect x='778' y='558' width='300' height='32' rx='8' fill='#fdecec' stroke='#d9534f' stroke-width='1.5' />
