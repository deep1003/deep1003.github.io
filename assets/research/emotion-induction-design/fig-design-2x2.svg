<text x='40' y='880' font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans CJK KR', 'Noto Sans KR', sans-serif" font-size='18' font-weight='400' fill='#5a6675' text-anchor='start' >같은 문항이 네 조건을 모두 거친다 (문항 내 대응 비교)</text>
<text x='760' y='160' font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans CJK KR', 'Noto Sans KR', sans-serif" font-size='28' font-weight='800' fill='#1d2733' text-anchor='start' >③ 그 뒤 질문에서 무엇을 재는가</text>
