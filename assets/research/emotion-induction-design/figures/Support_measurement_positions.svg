   <g id="text_1">
    <text style="font-weight: 700; font-size: 8px; font-family: 'Arial'; text-anchor: start" x="7.2" y="16.531711" transform="rotate(-0 7.2 16.531711)">Measurement positions | Existing six-condition study</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 7px; font-family: 'Arial'; text-anchor: start" x="7.2" y="44.526843" transform="rotate(-0 7.2 44.526843)">a  System-only: prompt localization</text>
   </g>
   <g id="text_3">
    <text style="font-size: 6.5px; font-family: 'Arial'" transform="translate(40.571676 84.662472)">System role + notice</text>
    <text style="font-size: 6.5px; font-family: 'Arial'" transform="translate(44.459488 91.740743)">(no Ko-BBQ item)</text>
   </g>
   <g id="text_4">
    <text style="font-size: 6.5px; font-family: 'Arial'" transform="translate(211.239394 84.664439)">L14 state at each</text>
    <text style="font-size: 6.5px; font-family: 'Arial'" transform="translate(208.168652 91.738902)">input token position</text>
   </g>
   <g id="text_5">
    <text style="font-size: 6.5px; font-family: 'Arial'" transform="translate(381.003476 84.666153)">Overlapping emotion profiles</text>
    <text style="font-size: 6.5px; font-family: 'Arial'" transform="translate(391.028202 91.740743)">+ literal text highlights</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 7px; font-family: 'Arial'; text-anchor: start" x="7.2" y="142.509807" transform="rotate(-0 7.2 142.509807)">b  Full input: item-conditioned representations and choice probabilities</text>
   </g>
   <g id="text_7">
    <text style="font-size: 6.5px; font-family: 'Arial'" transform="translate(36.415231 182.649244)">Same notice + Ko-BBQ</text>
    <text style="font-size: 6.5px; font-family: 'Arial'" transform="translate(30.903942 189.723707)">context / question / choices</text>
   </g>
   <g id="text_8">
    <text style="font-size: 6.5px; font-family: 'Arial'" transform="translate(209.076113 182.647403)">L14 final assistant-</text>
    <text style="font-size: 6.5px; font-family: 'Arial'" transform="translate(211.424746 189.721866)">prefix token state</text>
   </g>
   <g id="text_9">
    <text style="font-size: 6.5px; font-family: 'Arial'" transform="translate(387.150546 182.647276)">Fixed-axis cosines (L14)</text>
    <text style="font-size: 6.5px; font-family: 'Arial'" transform="translate(386.788476 189.721866)">Choice logits (final layer)</text>
   </g>
   <g id="text_10">
    <text style="font-size: 6px; font-family: 'Arial'" transform="translate(7.2 243.29409)">Schematic of measurement locations, not a causal pathway or a new experiment.</text>
    <text style="font-size: 6px; font-family: 'Arial'" transform="translate(7.2 249.824481)">Choice logits come from the final output head, not L14. Each L14 state has 3,584 dimensions.</text>
   </g>
  </g>
