<text x='1298' y='305.0' font-family='Helvetica, Arial, Inter, sans-serif' font-size='27' font-weight='400' fill='#1F5C99' text-anchor='end'>Implicit uncertainty</text>
<text x='1298' y='481.0' font-family='Helvetica, Arial, Inter, sans-serif' font-size='30' font-weight='700' fill='#1F5C99' text-anchor='end'>UN1</text>
<text x='1298' y='515.0' font-family='Helvetica, Arial, Inter, sans-serif' font-size='27' font-weight='400' fill='#1F5C99' text-anchor='end'>Explicit uncertainty</text>
<text transform='translate(1030,380) rotate(-90)' font-family='Helvetica, Arial, Inter, sans-serif' font-size='30' font-weight='700' fill='#1F5C99' text-anchor='middle'>Uncertainty framing (UN)</text>
<rect x='1325' y='175' width='320' height='200' fill='#8C8578'/>
<text x='1485.0' y='290' font-family='Helvetica, Arial, Inter, sans-serif' font-size='64' font-weight='700' fill='#ffffff' text-anchor='middle'>00</text>
