   <g id="text_11">
    <text style="font-size: 7px; font-family: 'Arial'; text-anchor: start" x="83.4732" y="289.41408" transform="rotate(-0 83.4732 289.41408)">Social judgment and matched comparisons</text>
   </g>
   <g id="text_12">
    <text style="font-size: 7px; font-family: 'Arial'" transform="translate(128.859031 321.098486)">139 selected ambiguous KoBBQ items × 4 notices × 3 choice rotations = 1,668 inputs</text>
    <text style="font-size: 7px; font-family: 'Arial'" transform="translate(156.267312 330.732018)">Outcome: probability assigned to the information-insufficient answer</text>
    <text style="font-size: 7px; font-family: 'Arial'" transform="translate(137.738094 340.358549)">Paired estimates; 91 category-template clusters; Holm correction for 3 contrasts</text>
   </g>
