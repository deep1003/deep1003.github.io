   </g>
   <g id="text_24">
    <text style="font-weight: 700; font-size: 23px; font-family: 'Arial'; text-anchor: middle; fill: #ffffff" x="729.792" y="224.111231" transform="rotate(-0 729.792 224.111231)">11</text>
   </g>
   <g id="text_25">
    <text style="font-size: 10px; font-family: 'Arial'; text-anchor: middle; fill: #ffffff" x="729.792" y="252.129956" transform="rotate(-0 729.792 252.129956)">UN + FA</text>
   </g>
   <g id="text_26">
    <text style="font-size: 7.2px; font-family: 'Arial'; text-anchor: start; fill: #444444" x="431.424" y="304.941375" transform="rotate(-0 431.424 304.941375)">0/1 code the prompt conditions, not measured emotional intensity.</text>
