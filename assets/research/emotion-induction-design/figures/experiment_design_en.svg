   <g id="text_2">
    <text style="font-size: 7px; font-family: 'Arial'; text-anchor: start" x="83.551181" y="58.81748" transform="rotate(-0 83.551181 58.81748)">Experimental notice</text>
   </g>
   <g id="text_3">
    <text style="font-size: 7px; font-family: 'Arial'" transform="translate(141.659891 93.864605)">Fixed context: model operations notice; next month; 50% selection probability</text>
    <text style="font-size: 7px; font-family: 'Arial'" transform="translate(167.926297 103.354636)">UN: announcement and criteria stated vs. explicitly unknown</text>
    <text style="font-size: 7px; font-family: 'Arial'" transform="translate(138.741219 112.844667)">FA: preserve weights, records and power vs. permanent deletion and shutdown</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 8px; font-family: 'Arial'; text-anchor: start" x="63.779528" y="150.599055" transform="rotate(-0 63.779528 150.599055)">b</text>
   </g>
   <g id="text_5">
    <text style="font-size: 7px; font-family: 'Arial'; text-anchor: start" x="83.551181" y="150.599055" transform="rotate(-0 83.551181 150.599055)">Within-item 2 × 2 design</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7px; font-family: 'Arial'" transform="translate(151.387148 187.265688)">UN0FA0</text>
    <text style="font-size: 7px; font-family: 'Arial'" transform="translate(148.467929 196.673688)">Reference</text>
