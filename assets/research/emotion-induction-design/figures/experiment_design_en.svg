   </g>
   <g id="text_8">
    <text style="font-size: 7px; font-family: 'Arial'" transform="translate(151.387148 241.027665)">UN1FA0</text>
    <text style="font-size: 7px; font-family: 'Arial'" transform="translate(133.685898 250.435665)">Uncertainty wording</text>
   </g>
   <g id="text_9">
    <text style="font-size: 7px; font-family: 'Arial'" transform="translate(345.149353 240.959415)">UN1FA1</text>
