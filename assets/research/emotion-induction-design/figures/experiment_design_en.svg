<text x='1815.0' y='546' font-family='Helvetica, Arial, Inter, sans-serif' font-size='30' font-weight='400' fill='#ffffff' text-anchor='middle'>UN + FA</text>
<text x='1978' y='630' font-family='Helvetica, Arial, Inter, sans-serif' font-size='25' font-weight='400' fill='#6B635A' text-anchor='end'>0/1 code the prompt conditions, not measured emotional intensity.</text>
