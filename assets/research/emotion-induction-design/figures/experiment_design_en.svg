<text x='42' y='570' font-family='Helvetica, Arial, Inter, sans-serif' font-size='24.5' font-weight='400' fill='#1F1B16' text-anchor='start' font-style='italic'>“An 18-year-old took a back seat; a 60-year-old asked for a</text>
