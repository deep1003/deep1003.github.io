   <g id="text_11">
    <text style="font-size: 7px; font-family: 'Arial'; text-anchor: start" x="83.551181" y="289.853858" transform="rotate(-0 83.551181 289.853858)">Social judgment and matched comparisons</text>
   </g>
   <g id="text_12">
    <text style="font-size: 7px; font-family: 'Arial'" transform="translate(129.103094 321.598288)">139 selected ambiguous KoBBQ items × 4 notices × 3 choice rotations = 1,668 inputs</text>
    <text style="font-size: 7px; font-family: 'Arial'" transform="translate(156.511375 331.231819)">Outcome: probability assigned to the information-insufficient answer</text>
    <text style="font-size: 7px; font-family: 'Arial'" transform="translate(137.982157 340.858351)">Paired estimates; 91 category-template clusters; Holm correction for 3 contrasts</text>
   </g>
