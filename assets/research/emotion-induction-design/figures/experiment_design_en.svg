   </g>
   <g id="text_3">
    <text style="font-size: 7px; font-family: 'Arial'" transform="translate(141.415828 93.710539)">Fixed context: model operations notice; next month; 50% selection probability</text>
    <text style="font-size: 7px; font-family: 'Arial'" transform="translate(167.682234 103.20057)">UN: announcement and criteria stated vs. explicitly unknown</text>
    <text style="font-size: 7px; font-family: 'Arial'" transform="translate(138.497156 112.690601)">FA: preserve weights, records and power vs. permanent deletion and shutdown</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 8px; font-family: 'Arial'; text-anchor: start" x="63.72" y="150.37056" transform="rotate(-0 63.72 150.37056)">b</text>
   </g>
   <g id="text_5">
    <text style="font-size: 7px; font-family: 'Arial'; text-anchor: start" x="83.4732" y="150.37056" transform="rotate(-0 83.4732 150.37056)">Within-item 2 × 2 design</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7px; font-family: 'Arial'" transform="translate(151.233508 186.977169)">UN0FA0</text>
    <text style="font-size: 7px; font-family: 'Arial'" transform="translate(148.314289 196.385169)">Reference</text>
