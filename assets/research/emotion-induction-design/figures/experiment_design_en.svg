<svg xmlns='http://www.w3.org/2000/svg' xml:space='preserve' viewBox='0 0 2000 730' width='2000' height='730' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id='ah' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto'><path d='M0 0 L10 5 L0 10 z' fill='#6B635A'/></marker></defs>
