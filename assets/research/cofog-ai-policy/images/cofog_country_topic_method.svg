<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1060" viewBox="0 0 1480 1060" role="img" aria-labelledby="title desc"><title id="title">임베딩과 BERTopic을 이용한 COFOG–국가–토픽 분석 설계</title><desc id="desc">정책 보고서를 문단으로 나누어 임베딩과 BERTopic으로 공통 토픽을 추출한다. 근거 문단의 COFOG와 국가를 연결해 세 항목의 결합 관계를 집계한다. 국가를 가운데 둔 3부 연결망과 임베딩 기반 토픽 의미 유사성은 별도로 시각화한다. 모든 연결은 설명용 예시다.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#6a8585"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#173136} .title{font-size:32px;font-weight:700}.h{font-size:23px;font-weight:700}.body{font-size:19px}.small{font-size:16px;fill:#51686b}.label{font-size:19px;font-weight:650}.edge{fill:none;stroke-linecap:round}</style><rect width="1480" height="1060" fill="#f6f8f3"/><text x="48" y="57" class="title" text-anchor="start">COFOG × 국가 × 토픽</text><text x="48" y="91" class="body" text-anchor="start">임베딩·BERTopic으로 정책의 내용과 연결 구조를 비교한다</text><text x="1430" y="58" class="small" text-anchor="end">분석 설계 · 실제 결과 아님</text><rect x="48" y="123" width="315" height="99" rx="14" fill="#eaf2ed" stroke="#d6e1dc"/><text x="205" y="162" class="label" text-anchor="middle">정책 보고서</text><text x="205" y="195" class="small" text-anchor="middle">국가·발행연도·문서 유형</text><path class="edge" d="M370,172 L394,172" stroke="#6a8585" stroke-width="2" marker-end="url(#arrow)"/><rect x="404" y="123" width="315" height="99" rx="14" fill="#eaf2ed" stroke="#d6e1dc"/><text x="561" y="162" class="label" text-anchor="middle">근거 문단</text><text x="561" y="195" class="small" text-anchor="middle">문서 ID·원문 위치 보존</text><path class="edge" d="M726,172 L750,172" stroke="#6a8585" stroke-width="2" marker-end="url(#arrow)"/><rect x="760" y="123" width="315" height="99" rx="14" fill="#eaf2ed" stroke="#d6e1dc"/><text x="917" y="162" class="label" text-anchor="middle">임베딩 + BERTopic</text><text x="917" y="195" class="small" text-anchor="middle">공통 토픽 추출·해석 검증</text><path class="edge" d="M1082,172 L1106,172" stroke="#6a8585" stroke-width="2" marker-end="url(#arrow)"/><rect x="1116" y="123" width="315" height="99" rx="14" fill="#eaf2ed" stroke="#d6e1dc"/><text x="1273" y="162" class="label" text-anchor="middle">COFOG와 연결·집계</text><text x="1273" y="195" class="small" text-anchor="middle">국가 × 기간 × 기능 × 토픽</text><rect x="48" y="252" width="930" height="464" rx="14" fill="#fff" stroke="#d6e1dc"/><rect x="1000" y="252" width="432" height="464" rx="14" fill="#fff" stroke="#d6e1dc"/><text x="72" y="290" class="h" text-anchor="start">A. 관측된 연결 · 3부 연결망</text><text x="72" y="321" class="small" text-anchor="start">국가를 가운데 배치하고, 동일 문단의 COFOG·토픽 결합을 추적한다.</text><text x="182" y="366" class="label" text-anchor="middle">정부기능 COFOG</text><text x="510" y="366" class="label" text-anchor="middle">국가</text><text x="830" y="366" class="label" text-anchor="middle">BERTopic 토픽</text><path class="edge" d="M294,444 L438,454" stroke="#438f87" stroke-width="3"/><path class="edge" d="M578,454 L714,426" stroke="#438f87" stroke-width="3"/><path class="edge" d="M294,444 L438,454" stroke="#438f87" stroke-width="3"/><path class="edge" d="M578,454 L714,536" stroke="#438f87" stroke-width="3"/><path class="edge" d="M294,554 L438,564" stroke="#438f87" stroke-width="3"/><path class="edge" d="M578,564 L714,536" stroke="#438f87" stroke-width="3"/><path class="edge" d="M294,664 L438,564" stroke="#438f87" stroke-width="3"/><path class="edge" d="M578,564 L714,646" stroke="#438f87" stroke-width="3"/><rect x="72" y="416" width="222" height="56" rx="14" fill="#fff" stroke="#d6e1dc"/><text x="183.0" y="452" class="label" text-anchor="middle">07 보건</text><rect x="72" y="526" width="222" height="56" rx="14" fill="#fff" stroke="#d6e1dc"/><text x="183.0" y="562" class="label" text-anchor="middle">09 교육</text><rect x="72" y="636" width="222" height="56" rx="14" fill="#fff" stroke="#d6e1dc"/><text x="183.0" y="672" class="label" text-anchor="middle">04 경제업무</text><rect x="438" y="426" width="140" height="56" rx="14" fill="#edf3f2" stroke="#d6e1dc"/><text x="508.0" y="462" class="label" text-anchor="middle">한국</text><rect x="438" y="536" width="140" height="56" rx="14" fill="#edf3f2" stroke="#d6e1dc"/><text x="508.0" y="572" class="label" text-anchor="middle">미국</text><rect x="714" y="398" width="235" height="56" rx="14" fill="#fff" stroke="#d6e1dc"/><text x="831.5" y="434" class="label" text-anchor="middle">의료 AI</text><rect x="714" y="508" width="235" height="56" rx="14" fill="#fff" stroke="#d6e1dc"/><text x="831.5" y="544" class="label" text-anchor="middle">AI 역량·교육</text><rect x="714" y="618" width="235" height="56" rx="14" fill="#fff" stroke="#d6e1dc"/><text x="831.5" y="654" class="label" text-anchor="middle">기업 AI 도입</text><text x="1024" y="290" class="h" text-anchor="start">B. 의미적 근접성</text><text x="1024" y="321" class="small" text-anchor="start">토픽 대표 문단의 임베딩 유사도</text><path class="edge" d="M1100,437 L1320,457" stroke="#ad804d" stroke-width="3" stroke-dasharray="7 7"/><path class="edge" d="M1100,437 L1222,594" stroke="#ad804d" stroke-width="3" stroke-dasharray="7 7"/><path class="edge" d="M1320,457 L1222,594" stroke="#ad804d" stroke-width="3" stroke-dasharray="7 7"/><circle cx="1100" cy="426" r="48" fill="#fbf2e6" stroke="#c7aa83"/><text x="1100" y="432" class="small" text-anchor="middle">의료 AI</text><circle cx="1320" cy="457" r="48" fill="#fbf2e6" stroke="#c7aa83"/><text x="1320" y="463" class="small" text-anchor="middle">건강 데이터</text><circle cx="1222" cy="594" r="48" fill="#fbf2e6" stroke="#c7aa83"/><text x="1222" y="600" class="small" text-anchor="middle">개인정보</text><text x="1024" y="685" class="small" text-anchor="start">점선 = 코사인 유사도 · 동시출현과 구분</text><rect x="48" y="740" width="1384" height="266" rx="14" fill="#fff" stroke="#d6e1dc"/><text x="72" y="781" class="h" text-anchor="start">연결선의 근거는 국가를 경유한 경로가 아니라 원문의 결합 관계다.</text><text x="72" y="820" class="label" text-anchor="start">저장할 단위</text><text x="260" y="820" class="body" text-anchor="start">국가·기간 | 보고서 ID·문단 ID | COFOG | 토픽</text><text x="72" y="859" class="label" text-anchor="start">연결 강도</text><text x="260" y="859" class="body" text-anchor="start">같은 문단에서 기능·토픽이 확인된 고유 보고서 수 및 기능별 보고서 대비 비율</text><text x="72" y="898" class="label" text-anchor="start">시간 비교</text><text x="260" y="898" class="body" text-anchor="start">공통 토픽·기능 기준을 유지해 국가별 연결 비중의 연도·기간별 변화를 비교</text><text x="72" y="951" class="small" text-anchor="start">주의 · 국가의 보건 문서와 교육 토픽이 각각 존재해도, 보건–교육 토픽의 연결이 확인된 것은 아니다.</text><text x="48" y="1038" class="small" text-anchor="start">모든 노드·연결은 설명용 예시다. 선 굵기·배치·거리는 실제 관측량이나 유사도를 나타내지 않는다.</text></svg>