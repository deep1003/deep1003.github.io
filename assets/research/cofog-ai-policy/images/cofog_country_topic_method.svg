<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1050" viewBox="0 0 1480 1050" role="img" aria-labelledby="title desc"><title id="title">재정·정책 관심 연결망과 원문 근거 연결망</title><desc id="desc">상단은 COFOG와 국가를 재정지출 비중으로, 국가와 토픽을 보고서 포함률로 연결한다. 하단은 같은 근거 문단에서 확인된 COFOG와 토픽의 실제 연결을 별도로 나타낸다. 2023년을 경계로 3년 구간을 비교하며 불완전 재정 자료는 관측 비중을 유지하는 단순 추정으로 구분한다. 연결은 설명용 예시다.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#173136}.title{font-size:32px;font-weight:700}.h{font-size:24px;font-weight:700}.body{font-size:20px}.small{font-size:17px;fill:#51686b}.label{font-size:20px;font-weight:650}.edge{fill:none;stroke-linecap:round}</style><rect width="1480" height="1050" fill="#f6f8f3"/><text x="48" y="56" class="title" text-anchor="start">재정 배분과 AI 정책 관심을 연결하고, 실제 논의 내용과 구분한다</text><text x="48" y="91" class="small" text-anchor="start">국가·기간별 비교 설계 · 노드와 연결은 설명용이며 실제 분석 결과가 아니다.</text><rect x="48" y="118" width="1384" height="435" rx="14" fill="#fff" stroke="#d6e1dc"/><text x="72" y="157" class="h" text-anchor="start">A. 재정–국가–토픽 · 서로 다른 두 지표를 연결</text><text x="190" y="209" class="label" text-anchor="middle">정부기능 COFOG</text><text x="730" y="209" class="label" text-anchor="middle">국가</text><text x="1240" y="209" class="label" text-anchor="middle">BERTopic 토픽</text><text x="438" y="247" class="label" text-anchor="middle">재정지출 비중</text><text x="1005" y="247" class="label" text-anchor="middle">보고서 포함률</text><path class="edge" d="M300,307 L640,332" stroke="#287f77" stroke-width="5"/><path class="edge" d="M300,387 L640,332" stroke="#287f77" stroke-width="5"/><path class="edge" d="M300,467 L640,427" stroke="#287f77" stroke-width="5"/><path class="edge" d="M820,332 L1130,307" stroke="#b77831" stroke-width="5"/><path class="edge" d="M820,332 L1130,387" stroke="#b77831" stroke-width="5"/><path class="edge" d="M820,427 L1130,387" stroke="#b77831" stroke-width="5"/><path class="edge" d="M820,427 L1130,467" stroke="#b77831" stroke-width="5"/><rect x="80" y="280" width="220" height="54" rx="14" fill="#fff" stroke="#d6e1dc"/><text x="190.0" y="315" class="label" text-anchor="middle">07 보건</text><rect x="80" y="360" width="220" height="54" rx="14" fill="#fff" stroke="#d6e1dc"/><text x="190.0" y="395" class="label" text-anchor="middle">09 교육</text><rect x="80" y="440" width="220" height="54" rx="14" fill="#fff" stroke="#d6e1dc"/><text x="190.0" y="475" class="label" text-anchor="middle">04 경제업무</text><rect x="640" y="305" width="180" height="54" rx="14" fill="#eaf2ed" stroke="#d6e1dc"/><text x="730.0" y="340" class="label" text-anchor="middle">한국</text><rect x="640" y="400" width="180" height="54" rx="14" fill="#eaf2ed" stroke="#d6e1dc"/><text x="730.0" y="435" class="label" text-anchor="middle">미국</text><rect x="1130" y="280" width="260" height="54" rx="14" fill="#fff" stroke="#d6e1dc"/><text x="1260.0" y="315" class="label" text-anchor="middle">의료 AI</text><rect x="1130" y="360" width="260" height="54" rx="14" fill="#fff" stroke="#d6e1dc"/><text x="1260.0" y="395" class="label" text-anchor="middle">AI 역량·교육</text><rect x="1130" y="440" width="260" height="54" rx="14" fill="#fff" stroke="#d6e1dc"/><text x="1260.0" y="475" class="label" text-anchor="middle">개인정보 보호</text><text x="72" y="528" class="small" text-anchor="start">청록선 = 기능 지출 / 전체 정부지출</text><text x="760" y="528" class="small" text-anchor="start">갈색선 = 토픽 포함 고유 보고서 / 전체 분석 보고서</text><rect x="48" y="575" width="1384" height="253" rx="14" fill="#fff" stroke="#d6e1dc"/><text x="72" y="615" class="h" text-anchor="start">B. 실제 COFOG–토픽 연결 · 동일 근거 문단에서 확인</text><path class="edge" d="M300,687 L710,687" stroke="#438f87" stroke-width="4"/><path class="edge" d="M300,767 L710,767" stroke="#438f87" stroke-width="4"/><rect x="80" y="660" width="220" height="54" rx="14" fill="#fff" stroke="#d6e1dc"/><text x="190.0" y="695" class="label" text-anchor="middle">07 보건</text><rect x="80" y="740" width="220" height="54" rx="14" fill="#fff" stroke="#d6e1dc"/><text x="190.0" y="775" class="label" text-anchor="middle">09 교육</text><rect x="710" y="660" width="240" height="54" rx="14" fill="#fff" stroke="#d6e1dc"/><text x="830.0" y="695" class="label" text-anchor="middle">의료 AI</text><rect x="710" y="740" width="240" height="54" rx="14" fill="#fff" stroke="#d6e1dc"/><text x="830.0" y="775" class="label" text-anchor="middle">AI 역량·교육</text><text x="1000" y="674" class="label" text-anchor="start">국가·기간별로 따로 집계</text><text x="1000" y="711" class="small" text-anchor="start">선 = 해당 결합을 확인한 보고서의</text><text x="1000" y="738" class="small" text-anchor="start">해당 기능 보고서 대비 비율</text><text x="1000" y="786" class="small" text-anchor="start">국가별 결합을 합산하면 전체 2부망</text><rect x="48" y="850" width="1384" height="144" rx="14" fill="#eaf2ed" stroke="#d6e1dc"/><text x="72" y="889" class="label" text-anchor="start">기간 · 2020–2022년 ↔ 2023–2025년 · 3년 구간 우선, 5년 구간은 보조 비교</text><text x="72" y="929" class="body" text-anchor="start">재정 비중이 1년만 있으면 그 값을 3년 대표 추정값으로 사용 · 관측 1/3년 표시</text><text x="72" y="966" class="small" text-anchor="start">A의 국가 경유 경로는 B의 연결을 입증하지 않는다. 기능 전체 재정은 AI 예산이 아니다.</text><text x="48" y="1027" class="small" text-anchor="start">의미적 근접성은 별도 분석 · 토픽 대표 문단 임베딩의 코사인 유사도이며 위 연결선의 가중치가 아니다.</text></svg>