<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">전체 AI 정책 토픽의 병렬 분석모형</title>
  <desc id="desc">OECD AI 정책문서에서 BERTopic 토픽을 생성한다. 주 분석은 사회정책 6개 영역으로 직접 연결하고, 강건성 검증은 COFOG 10개 기능을 거쳐 같은 영역으로 연결한 뒤 국가별로 비교한다.</desc>
  <defs>
    <style>
      .bg{fill:#f6f8f3}.box{fill:#fff;stroke:#8da9a1;stroke-width:2}.main{fill:#eaf2ed;stroke:#176b64;stroke-width:2.6}.robust{fill:#edf2f5;stroke:#4f7080;stroke-width:2.2}.crosswalk{fill:#fff5e7;stroke:#b77935;stroke-width:2.2}.line{fill:none;stroke:#176b64;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.dash{fill:none;stroke:#4f7080;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:9 8}.t{font:700 23px -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#173136}.s{font:500 16px -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#51686b}.label{font:700 18px -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#176b64}.rlabel{font:700 18px -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#4f7080}
    </style>
  </defs>
  <rect class="bg" width="1200" height="620" rx="24"/>

  <rect class="box" x="48" y="245" width="255" height="130" rx="18"/>
  <text class="t" x="175.5" y="295" text-anchor="middle"><tspan x="175.5">OECD AI 정책문서</tspan><tspan class="s" x="175.5" dy="34">전체 문서</tspan><tspan class="s" x="175.5" dy="25">사전 영역 선별 없음</tspan></text>

  <rect class="box" x="365" y="245" width="255" height="130" rx="18"/>
  <text class="t" x="492.5" y="290" text-anchor="middle"><tspan x="492.5">BERTopic 토픽</tspan><tspan class="s" x="492.5" dy="32">STPI 정제와 연구자 검수</tspan><tspan class="s" x="492.5" dy="26">복수 토픽 · 관련성 가중치</tspan></text>
  <path class="line" d="M303 310 L352 310"/>

  <text class="label" x="690" y="55">주 분석</text>
  <rect class="main" x="690" y="75" width="305" height="150" rx="18"/>
  <text class="t" x="842.5" y="123" text-anchor="middle"><tspan x="842.5">사회정책 6개 영역</tspan><tspan class="s" x="842.5" dy="32">사회보장 · 보건의료 · 고용</tspan><tspan class="s" x="842.5" dy="26">돌봄 · 교육 · 주택</tspan></text>
  <path class="line" d="M620 275 C655 264 660 150 678 150"/>

  <text class="rlabel" x="690" y="343">강건성 검증</text>
  <rect class="robust" x="690" y="363" width="305" height="112" rx="18"/>
  <text class="t" x="842.5" y="410" text-anchor="middle"><tspan x="842.5">COFOG 10개 기능</tspan><tspan class="s" x="842.5" dy="31">공적 목적의 국제표준 분류</tspan></text>
  <path class="dash" d="M620 345 C654 356 660 419 678 419"/>

  <rect class="crosswalk" x="690" y="505" width="305" height="88" rx="18"/>
  <text class="t" x="842.5" y="540" text-anchor="middle"><tspan x="842.5">사회정책 6개 영역</tspan><tspan class="s" x="842.5" dy="28">COFOG N:N 교차표 경유</tspan></text>
  <path class="dash" d="M842.5 475 L842.5 493"/>

  <rect class="box" x="1052" y="238" width="112" height="144" rx="18"/>
  <text class="t" x="1108" y="286" text-anchor="middle"><tspan x="1108">국가</tspan><tspan x="1108" dy="30">비교</tspan><tspan class="s" x="1108" dy="30">규모 · 구성</tspan></text>
  <path class="line" d="M995 150 C1031 150 1025 270 1040 282"/>
  <path class="dash" d="M995 549 C1036 535 1026 361 1040 344"/>
</svg>
