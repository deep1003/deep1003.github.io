  <g id="text_13">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(35.229687 351.685625)">Unchanged manuscript equation, occupation/year fixed effects, exposure-specific linear trend and 2019–2021 occupation employment weights.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(130.177344 365.922813)">Exposure is standardised once, on the same 29-occupation candidate group; no annual restandardisation.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(133.477344 380.16)">95% occupation-clustered intervals. These slopes are distinct from the high–low aggregate growth rates.</text>
  </g>
